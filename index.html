<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanakoeharjoittelu</title>
    <!-- Tuodaan Tesseract.js kuvantunnistusta (OCR) varten -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }
        h1, h2 {
            color: #1e293b;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        button, .file-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            display: inline-block;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover, .file-btn:hover {
            background-color: #2563eb;
        }
        button:active, .file-btn:active {
            transform: scale(0.98);
        }
        button.secondary {
            background-color: #64748b;
        }
        button.secondary:hover {
            background-color: #475569;
        }
        button.mic-btn {
            background-color: #10b981;
        }
        button.mic-btn.recording {
            background-color: #ef4444;
            animation: pulse 1.2s infinite;
        }
        .camera-btn {
            background-color: #8b5cf6;
        }
        .camera-btn:hover {
            background-color: #7c3aed;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .hidden {
            display: none !important;
        }

        /* Kääntökortin tyylit */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 180px;
            margin: 20px auto;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card-front {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 2px solid #bae6fd;
        }
        .card-back {
            background-color: #f8fafc;
            color: #0f172a;
            transform: rotateY(180deg);
            border: 2px solid #cbd5e1;
        }
        .card-back.correct {
            background-color: #dcfce7;
            border-color: #86efac;
            color: #166534;
        }
        .card-back.wrong {
            background-color: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .status-text {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. PÄÄVÄLILEHTI -->
        <div id="view-main">
            <h1>Sanakoeharjoittelu</h1>
            <p>Valitse kieli, jota haluat harjoitella:</p>
            <button onclick="selectLanguage('en')">Sanakoe Englanti</button>
            <button onclick="selectLanguage('sv')">Sanakoe Ruotsi</button>
        </div>

        <!-- 2. SUUNNAN VALINTA -->
        <div id="view-direction" class="hidden">
            <h2 id="lang-title">Englanti</h2>
            <p>Valitse käännössuunta:</p>
            <button id="btn-fi-to-target" onclick="selectDirection('fi-to-target')">Suomi - Englanti</button>
            <button id="btn-target-to-fi" onclick="selectDirection('target-to-fi')">Englanti - Suomi</button>
            <br><br>
            <button class="secondary" onclick="goHome()">← Takaisin</button>
        </div>

        <!-- 3. SANOJEN SYÖTTÖ & KUVA -->
        <div id="view-input" class="hidden">
            <h2 id="input-title">Syötä sanat</h2>
            <p id="input-instructions">Kirjoita tai ota kuva sanalistasta:</p>
            
            <!-- Kameran / kuvan latauksen nappi -->
            <label for="image-input" class="file-btn camera-btn">📸 Ota kuva tai lataa kuva kirjasta</label>
            <input type="file" id="image-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">

            <textarea id="words-textarea" rows="5" placeholder="esim. football, basketball, floorball"></textarea>
            
            <button id="start-btn" onclick="prepareCards()">Aloita harjoittelu</button>
            <p id="loading-msg" class="hidden">Käsitellään kuvaa ja käännetään sanoja, odota hetki...</p>
            <br>
            <button class="secondary" onclick="backToDirection()">← Takaisin</button>
        </div>

        <!-- 4. KÄÄNTÖKORTTIHARJOITTELU -->
        <div id="view-practice" class="hidden">
            <div class="status-text" id="progress-text">Sana 1 / 3</div>
            
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front" id="card-question">
                        <!-- Kysyttävä sana tulee tähän -->
                    </div>
                    <div class="card-face card-back" id="card-answer">
                        <!-- Oikea vastaus tulee tähän -->
                    </div>
                </div>
            </div>

            <div id="answer-controls">
                <input type="text" id="user-answer" placeholder="Kirjoita vastaus tähän..." onkeypress="handleKeyPress(event)">
                <div>
                    <button onclick="checkAnswer()">Tarkista</button>
                    <button class="mic-btn" id="mic-btn" onclick="startSpeech()">🎤 Vastaa äänellä</button>
                </div>
            </div>

            <div id="next-controls" class="hidden">
                <button onclick="nextCard()">Seuraava kortti →</button>
            </div>
        </div>

        <!-- 5. VALMIS -->
        <div id="view-done" class="hidden">
            <h2>Hienoa työtä! 🎉</h2>
            <p>Olet saanut kaikki sanat oikein!</p>
            <button onclick="goHome()">Palaa alkuun</button>
        </div>
    </div>

    <script>
        let selectedLang = 'en'; 
        let direction = 'fi-to-target'; 
        let cardsQueue = [];
        let currentCard = null;
        let isFlipped = false;

        function showView(viewId) {
            document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function goHome() {
            showView('view-main');
        }

        function selectLanguage(lang) {
            selectedLang = lang;
            const langName = lang === 'en' ? 'Englanti' : 'Ruotsi';
            document.getElementById('lang-title').innerText = `Sanakoe ${langName}`;
            document.getElementById('btn-fi-to-target').innerText = `Suomi - ${langName}`;
            document.getElementById('btn-target-to-fi').innerText = `${langName} - Suomi`;
            showView('view-direction');
        }

        function backToDirection() {
            showView('view-direction');
        }

        function selectDirection(dir) {
            direction = dir;
            const langName = selectedLang === 'en' ? 'englanniksi' : 'ruotsiksi';
            const example = selectedLang === 'en' ? 'esim. football, basketball, floorball' : 'esim. fotboll, basket, innebandy';
            
            document.getElementById('input-instructions').innerText = 
                `Kirjoita sanat ${langName} tai ota kuva kirjasta:`;
            document.getElementById('words-textarea').placeholder = example;
            document.getElementById('words-textarea').value = '';
            showView('view-input');
        }

        // Käsittele käyttäjän ottama/lataama kuva (OCR - Tekstintunnistus)
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loadingMsg = document.getElementById('loading-msg');
            loadingMsg.innerText = "Luetaan sanoja kuvasta (OCR)... Odota hetki.";
            loadingMsg.classList.remove('hidden');

            try {
                // Tunnistetaan kieli Tesseractilla (valitaan englanti/ruotsi + suomi)
                const ocrLang = selectedLang === 'en' ? 'eng' : 'swe';
                
                const result = await Tesseract.recognize(
                    file,
                    ocrLang + '+fin',
                    { logger: m => console.log(m) }
                );

                // Asetetaan tunnistettu teksti suoraan tekstikenttään, jotta sen voi tarvittaessa tarkistaa
                document.getElementById('words-textarea').value = result.data.text.trim();
                loadingMsg.classList.add('hidden');
            } catch (error) {
                console.error("Kuvantunnistusvirhe:", error);
                alert("Tekstin lukeminen kuvasta epäonnistui. Kokeile uudelleen tai kirjoita sanat käsin.");
                loadingMsg.classList.add('hidden');
            }
        }

        async function translateWord(word, sourceLang, targetLang) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${sourceLang}|${targetLang}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.responseData.translatedText.toLowerCase().trim();
            } catch (error) {
                console.error("Käännösvirhe:", error);
                return "(käännös epäonnistui)";
            }
        }

        async function prepareCards() {
            const rawText = document.getElementById('words-textarea').value;
            const words = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);

            if (words.length === 0) {
                alert("Ei löydy sanoja! Kirjoita tai ota kuva ensin.");
                return;
            }

            document.getElementById('start-btn').disabled = true;
            document.getElementById('loading-msg').innerText = "Käännetään sanoja, odota hetki...";
            document.getElementById('loading-msg').classList.remove('hidden');

            cardsQueue = [];

            for (let word of words) {
                const cleanTargetWord = word.toLowerCase();
                const finnishTranslation = await translateWord(cleanTargetWord, selectedLang, 'fi');
                
                if (direction === 'fi-to-target') {
                    cardsQueue.push({
                        question: finnishTranslation,
                        answer: cleanTargetWord
                    });
                } else {
                    cardsQueue.push({
                        question: cleanTargetWord,
                        answer: finnishTranslation
                    });
                }
            }

            cardsQueue.sort(() => Math.random() - 0.5);

            document.getElementById('start-btn').disabled = false;
            document.getElementById('loading-msg').classList.add('hidden');

            showView('view-practice');
            loadNextCard();
        }

        function loadNextCard() {
            if (cardsQueue.length === 0) {
                showView('view-done');
                return;
            }

            isFlipped = false;
            currentCard = cardsQueue[0];

            const cardEl = document.getElementById('flashcard');
            const backEl = document.getElementById('card-answer');
            cardEl.classList.remove('flipped');
            backEl.classList.remove('correct', 'wrong');

            document.getElementById('progress-text').innerText = `Kortteja jäljellä: ${cardsQueue.length}`;
            document.getElementById('card-question').innerText = currentCard.question;
            document.getElementById('user-answer').value = '';
            
            document.getElementById('answer-controls').classList.remove('hidden');
            document.getElementById('next-controls').classList.add('hidden');
            document.getElementById('user-answer').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isFlipped) {
                checkAnswer();
            } else if (event.key === 'Enter' && isFlipped) {
                nextCard();
            }
        }

        function checkAnswer() {
            if (isFlipped) return;

            const userAnswer = document.getElementById('user-answer').value.trim().toLowerCase();
            if (!userAnswer) return;

            isFlipped = true;
            const cardEl = document.getElementById('flashcard');
            const backEl = document.getElementById('card-answer');

            cardsQueue.shift();

            if (userAnswer === currentCard.answer) {
                backEl.classList.add('correct');
                backEl.innerHTML = `✅ Oikein!<br><span style="font-size: 18px; margin-top: 8px;">${currentCard.answer}</span>`;
            } else {
                backEl.classList.add('wrong');
                backEl.innerHTML = `❌ Väärin!<br><span style="font-size: 16px; font-weight: normal; margin-top: 8px;">Oikea vastaus: <strong>${currentCard.answer}</strong></span>`;
                cardsQueue.push(currentCard);
            }

            cardEl.classList.add('flipped');

            document.getElementById('answer-controls').classList.add('hidden');
            document.getElementById('next-controls').classList.remove('hidden');
        }

        function nextCard() {
            loadNextCard();
        }

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Selaimesi ei tue puheentunnistusta. Kokeile Google Chromea tai Microsoft Edgeä.");
                return;
            }

            const recognition = new SpeechRecognition();
            
            if (direction === 'fi-to-target') {
                recognition.lang = selectedLang === 'en' ? 'en-US' : 'sv-SE';
            } else {
                recognition.lang = 'fi-FI';
            }

            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('recording');
            micBtn.innerText = "🎤 Kuunnellaan...";

            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                transcript = transcript.replace(/[.,!?]+$/, '').trim().toLowerCase();
                document.getElementById('user-answer').value = transcript;
                checkAnswer();
            };

            recognition.onerror = function(event) {
                alert("Ääntä ei tunnistettu. Varmista mikrofonin luvat.");
            };

            recognition.onend = function() {
                micBtn.classList.remove('recording');
                micBtn.innerText = "🎤 Vastaa äänellä";
            };

            recognition.start();
        }
    </script>
</body>
</html>
